[package]
name = "twitch_oauth_token"
version = "5.0.1"
edition = "2024"
rust-version = "1.85"
description = "Type-safe Twitch OAuth 2.0 authentication library with CSRF protection and full scope support"
documentation = "https://docs.rs/twitch_oauth_token"
repository = "https://github.com/m3idnotfree/twitch_oauth"
license = "MIT OR Apache-2.0"
keywords = ["api", "authentication", "oauth", "oauth2", "twitch"]
categories = ["api-bindings", "authentication", "web-programming"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[[example]]
name = "app-token"
path = "examples/app_token.rs"

[[example]]
name = "user-token"
path = "examples/user_token.rs"

[[example]]
name = "device"
path = "examples/device_flow.rs"
required-features = ["tracing"]

[[example]]
name = "oneshot"
path = "examples/oneshot.rs"
required-features = ["oneshot"]

[dependencies]
asknothingx2-util = { version = "0.6.0", features = ["api", "oauth"] }
chrono = { version = "0.4.45", features = ["serde"] }
reqwest = { version = "0.13.5", features = ["multipart"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
serde_path_to_error = "0.1.20"
serde_urlencoded = "0.7.1"
tokio = { version = "1.53.2", default-features = false, features = ["time"] }
tracing = { version = "0.1.44", default-features = false, optional = true }
url = { version = "2.5.8", features = ["serde"] }

[dev-dependencies]
anyhow = "1.0.104"
axum = "0.8.9"
axum-extra = { version = "0.12.6", features = ["typed-header"] }
dotenvy = "0.15.7"
serde_json = "1.0.151"
tokio = { version = "1.53.2", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
wiremock = "0.6.5"

[features]
full = ["oneshot", "test", "tracing"]
oneshot = ["asknothingx2-util/oauth-server"]
test = []
tracing = ["dep:tracing"]
