[package]
name = "twitch_oauth_token"
version = "7.0.0"
edition = "2024"
rust-version = "1.85"
description = "Twitch OAuth 2.0 client with state verification"
documentation = "https://docs.rs/twitch_oauth_token"
repository = "https://github.com/m3idnotfree/twitch_oauth"
license = "MIT OR Apache-2.0"
keywords = ["api", "authentication", "oauth", "oauth2", "twitch"]
categories = ["api-bindings", "authentication", "web-programming"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[[example]]
name = "app-token"
path = "examples/app_token.rs"

[[example]]
name = "user-token"
path = "examples/user_token.rs"

[[example]]
name = "device"
path = "examples/device_flow.rs"

[[example]]
name = "mock-api"
path = "examples/mock_api.rs"
required-features = ["mock-api"]

[[test]]
name = "mock_api"
path = "tests/mock_api.rs"
required-features = ["mock-api"]

[dependencies]
asknothingx2-http = { version = "0.2.2", features = ["reqwest"] }
asknothingx2-oauth = { version = "0.1.0", features = ["generate-state", "serde"] }
bytes = "1.12.1"
http = "1.5.0"
http-body = "1.1.0"
reqwest = "0.13.5"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
serde_path_to_error = "0.1.20"
serde_urlencoded = "0.7.1"
tokio = { version = "1.53.2", default-features = false, features = ["time"] }
tower-layer = "0.3.3"
tower-service = "0.3.3"
tracing = { version = "0.1.44", default-features = false, optional = true }
url = { version = "2.5.8", features = ["serde"] }

[dev-dependencies]
anyhow = "1.0.104"
axum = "0.8.9"
axum-extra = { version = "0.12.6", features = ["typed-header"] }
dotenvy = "0.15.7"
scraper = "0.29.0"
serde_json = "1.0.151"
tokio = { version = "1.53.2", features = ["full"] }
wiremock = "0.6.5"

[features]
full = ["mock-api", "tracing"]
mock-api = []
tracing = ["dep:tracing"]
